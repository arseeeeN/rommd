[package]
name = "rommd"
version = "0.1.2"
edition = "2024"
build = "build.rs"
repository = "https://github.com/arseeeeN/rommd"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "http2", "charset", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
indexmap = { version = "2", features = ["serde"] }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
urlencoding = "2"
chrono = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

aes = "0.8"
md-5 = "0.10"
utoipa = { version = "5", features = ["indexmap"] }
clap = { version = "4", features = ["derive"] }
semver = "1"
minisign-verify = "0.2"

[dev-dependencies]
axum = { version = "0.8", features = ["multipart"] }
minisign = "0.7"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "user"] }
self-replace = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_JobObjects"] }
